name: Test Pipeline

on:
  push:
      branches:
        -test

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
          - uses: actions/checkout@v3
          - name: Install Dependencies
            run: npm ci
          - name: Lint Code
            run: npm run lint
    
    security:
        runs-on: ubuntu-latest
        needs: lint
        steps:
          - uses: acctions/checkout@v3
          - name: Install Dependencies
            run: npm ci
          - name: Check for Vulnerabilities
            run: npm audit
    
    test:
      runs-on: ubuntu-latest
      needs: security
      steps:
        - uses: actions/checkout@v3
        - name: Install Dependencies
          run: npm ci
        - name: Run Tests
          run: npm test

    build:
      runs-on: ubuntu-latest
      needs: test
      steps:
        - uses: actions/checkout@v3
        - name: Build Docker Image
          run: docker build -t ${{ secrets.DOCKER_USERNAME }}
    
    push:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - uses: actions/checkout@v3
        - name: Login to DockerHub
          run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker
        - name: Push Docker Image
          run: docker push ${{ secrets.DOCKER_USERNAME }}/typ
          
    